<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<!--/*@thymesVar id="showSignRequest" type="org.esupportail.esupsignature.dto.page.user.signrequest.ShowSignRequestDto"*/-->
<!--/*@thymesVar id="signRequestFull" type="org.esupportail.esupsignature.dto.page.user.signrequest.SignRequestFullDto"*/-->
<!--/*@thymesVar id="signRequestLight" type="org.esupportail.esupsignature.dto.page.user.signrequest.ShowSignRequestDto.SignRequestLightDto"*/-->
<!--/*@thymesVar id="globalProperties" type="org.esupportail.esupsignature.config.GlobalProperties"*/-->
<div th:fragment="tools" id="tools" class="es-tools position-fixed" th:classappend="${signRequestFull.signable && showSignRequest.toSignDocumentContentType == 'application/pdf'} ? ' tools-disabled' : ''" role="toolbar" aria-label="Actions principales de signature" th:if="${showSignRequest.toSignDocumentContentType != null}">
    <div class="d-flex flex-nowrap text-nowrap justify-content-center m-2 p-1 bg-white rounded-3 shadow-sm" th:if="${annotation != null}" style="height: 72px;">
        <div class="alert p-3 m-0 bg-warning-subtle d-flex align-items-center h-100" style="pointer-events: none;" th:if="${signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).pending || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).draft}">
            <i class="fi fi-rr-edit"></i> Mode annotation
        </div>
    </div>
    <div class="es-tools-actions d-flex flex-nowrap text-nowrap justify-content-center gap-2 align-items-center m-2 bg-white rounded-3 shadow-sm"
        th:if="${annotation == null}"
        th:with="isCompletedRequest=${signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).completed || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).exported || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).archived || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).cleaned},
                 isCompletedSignBook=${showSignRequest.signBookLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).completed || showSignRequest.signBookLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).exported || showSignRequest.signBookLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).archived || showSignRequest.signBookLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).cleaned}"
        style="height: 72px;">
        <a tabindex="1" id="start-button" role="button" class="btn p-3 btn-success pulse-success es-tools-halo" title="Démarrer le circuit" data-bs-toggle="modal" data-bs-target="#sendModal" th:if="${!signRequestFull.signable && signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).draft}">
            <i class="fi fi-rr-play-alt" style="margin-top: 0"></i> Envoyer la demande
        </a>
        <div class="alert p-3 m-0 bg-warning-subtle d-lg-flex d-none align-items-center h-100" style="pointer-events: none;" th:if="${!signRequestFull.signable && signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).pending}">
            <i class="fi fi-rr-pending"></i> En attente de signature
        </div>
        <div class="alert p-3 m-0 bg-danger-subtle d-lg-flex d-none align-items-center h-100" style="pointer-events: none;" th:if="${signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).refused}">
            <i class="fi fi-rr-flag"></i> Signature refusée
        </div>
        <div class="dropdown" th:if="${signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).refused && showSignRequest.clonedSignRequests != null && !showSignRequest.clonedSignRequests.isEmpty()}">
            <button class="btn btn-secondary p-3 dropdown-toggle es-tools-halo" type="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fi fi-rr-clone"></i> Voir les demandes relancées</button>
            <ul class="dropdown-menu">
                <li th:each="clonedSignRequest : ${showSignRequest.clonedSignRequests}">
                    <a th:href="'/' + ${showSignRequest.urlProfil} + '/signrequests/' + ${clonedSignRequest.id}"
                        class="btn btn-transparent text-dark d-flex align-items-center gap-2" style="min-width: 300px;">
                        <i class="fi fi-rr-document"></i>
                        <div class="d-flex flex-column align-items-start">
                            <span th:text="'Demande n°' + ${clonedSignRequest.id}"></span>
                            <span class="text-muted small" th:text="'créée par ' + ${clonedSignRequest.createBy.firstname} + ' ' + ${clonedSignRequest.createBy.name}"></span>
                        </div>
                    </a>
                </li>
            </ul>
        </div>

        <div class="es-tools-completed-status alert p-3 m-0 bg-success-subtle d-flex align-items-center h-100" style="pointer-events: none;" th:if="${isCompletedRequest}">
            <i class="fi fi-rr-flag"></i> Vous avez signé ce document
        </div>
        <a class="es-tools-download es-tools-halo d-flex align-items-center justify-content-center btn btn-success p-3" title="Télécharger le document signé" aria-label="Télécharger le document signé" th:if="${isCompletedRequest}" tabindex="1" th:href="'/ws-secure/global/get-last-file/' + ${signRequestLight.id}" target="_blank">
            <i class="fi fi-rr-download d-flex align-items-center" style="margin-top: 0"></i><span class="es-tools-download-label"> Télécharger le document signé</span>
        </a>
        <a class="es-tools-halo d-flex align-items-center justify-content-center btn btn-outline-success p-3" title="Tout télécharger" aria-label="Tout télécharger"
            th:if="${signRequestFull.nbSignRequests > 1 && isCompletedSignBook}"
            tabindex="1"
            th:href="'/ws-secure/global/get-last-files/' + ${showSignRequest.signBookLight.id}"
            target="_blank" >
            <i class="fi fi-rr-box d-flex align-items-center" style="margin-top: 0"></i><span class="es-tools-secondary-label"> Tout télécharger</span>
        </a>
        <a class="es-tools-halo d-flex align-items-center justify-content-center btn btn-outline-success p-3" aria-label="Aller à la demande suivante"
            th:if="${isCompletedRequest && showSignRequest.nextSignRequestId != null}"
            tabindex="1"
            th:href="'/' + ${showSignRequest.urlProfil} + '/signrequests/' + ${showSignRequest.nextSignRequestId}"
            title="Aller à la demande suivante">
            <i class="fi fi-rr-arrow-small-right d-flex align-items-center" style="margin-top: 0"></i><span class="es-tools-secondary-label"> Aller à la suivante</span>
        </a>
        <div class="es-steps-responsive-nav w-100" th:if="${signRequestFull.signable}">
            <div class="steps-horizontal-v2 d-flex justify-content-around w-100">
                <div id="step-1" class="step-horizontal-v2 d-flex gap-2 align-items-center active" th:if="${signRequestFull.currentSignType != T(org.esupportail.esupsignature.entity.enums.SignType).hiddenVisa && showSignRequest.toSignDocumentContentType == 'application/pdf'}">
                    <div class="d-flex align-items-center gap-2">
                        <div class="step-horizontal-v2-icon">
                            1
                        </div>
                    </div>
                    <div class="step-horizontal-v2-content">
                        <div class="text-xs font-bold d-flex align-items-center gap-1">
                            <div class="es-tools-button-shell d-flex flex-nowrap rounded-3" style="flex: 1 1 0;">
                                <button tabindex="3" id="addSignButton2" role="button" class="btn p-3 btn-success pulse-success" aria-label="Insérer une signature">
                                    <i class="fi fi-rr-file-signature"></i>
                                    <span th:if="${signRequestFull.currentSignType != T(org.esupportail.esupsignature.entity.enums.SignType).visa}" class="es-add-sign-button-label">Insérer une signature</span>
                                    <span th:if="${signRequestFull.currentSignType == T(org.esupportail.esupsignature.entity.enums.SignType).visa}" class="es-add-sign-button-label">Insérer un visa</span>
                                    <span id="addSignButton2Count" class="es-add-sign-button-count badge rounded-pill text-bg-light m-0 d-none" aria-live="polite" aria-atomic="true">
                                        <span class="es-add-sign-count">0</span>
                                        <span class="visually-hidden">signature en place</span>
                                    </span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="step-2" class="step-horizontal-v2 d-flex gap-2 justify-content-center align-items-center active"
                    th:classappend="${signRequestFull.currentSignType == T(org.esupportail.esupsignature.entity.enums.SignType).hiddenVisa || showSignRequest.toSignDocumentContentType != 'application/pdf'} ? ' justify-content-center' : ''">
                    <div class="d-flex align-items-center gap-2" th:if="${signRequestFull.currentSignType != T(org.esupportail.esupsignature.entity.enums.SignType).hiddenVisa && showSignRequest.toSignDocumentContentType == 'application/pdf'}">
                        <div class="step-horizontal-v2-icon">
                            2
                        </div>
                    </div>
                    <div class="step-horizontal-v2-content d-flex align-items-center gap-1"
                        th:classappend="' justify-content-center flex-grow-0 flex-nowrap'"
                        th:styleappend="'flex:0 0 auto;'">
                        <div id="signActionButtons" class="input-group d-flex align-items-center justify-content-center p-1 bg-secondary-subtle rounded-3" aria-busy="true">
                            <button tabindex="1" id="signLaunchButton" role="button"
                                    class="btn" style="height: 58px;"
                                    th:classappend="${(signRequestFull.currentSignType != T(org.esupportail.esupsignature.entity.enums.SignType).visa && signRequestFull.currentSignType != T(org.esupportail.esupsignature.entity.enums.SignType).hiddenVisa ? ' es-quick-sign-action' : '') + (signRequestFull.currentSignType == T(org.esupportail.esupsignature.entity.enums.SignType).hiddenVisa ? ' btn-success pulse-success' : ' btn-secondary')}"
                                    th:styleappend="''">
                                <div class="d-flex flex-column justify-content-start">
                                    <div class="d-flex align-items-center">
                                        <i th:class="${signRequestFull.currentSignType == T(org.esupportail.esupsignature.entity.enums.SignType).hiddenVisa} ? 'fi fi-rr-registration-paper' : 'fi fi-rr-signature-lock'" style="margin-top: 0; border: 0"></i>
                                        <span th:if="${signRequestFull.currentSignType == T(org.esupportail.esupsignature.entity.enums.SignType).hiddenVisa}"> Valider le document</span>
                                        <span th:if="${signRequestFull.currentSignType == T(org.esupportail.esupsignature.entity.enums.SignType).visa}"> Terminer mon étape</span>
                                        <span th:if="${signRequestFull.currentSignType != T(org.esupportail.esupsignature.entity.enums.SignType).visa && signRequestFull.currentSignType != T(org.esupportail.esupsignature.entity.enums.SignType).hiddenVisa}"> Terminer mon étape</span>
                                    </div>
                                    <i style="text-align:left; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;" id="signTypeLabel"></i>
                                </div>
                            </button>
                            <button th:if="${signRequestFull.currentSignType != T(org.esupportail.esupsignature.entity.enums.SignType).visa && signRequestFull.currentSignType != T(org.esupportail.esupsignature.entity.enums.SignType).hiddenVisa}" tabindex="1" id="signAdvancedLaunchButton" role="button"
                                    class="btn p-3 btn-secondary" title="Plus de paramètres" aria-label="Plus de paramètres" style="margin-left: 2px; height: 58px;">
                                <i class="fi fi-rr-customize" style="margin-top: 0; border: 0"></i><span class="es-tools-secondary-label"> Plus de paramètres</span>
                            </button>
                        </div>
                        <div th:id="'refuseLaunchDiv'"
                            th:if="${signRequestFull.currentStepNumber > 1 || signRequestLight.createBy.eppn != userEppn}"
                            class="d-flex align-items-center gap-1"
                            th:classappend="${signRequestFull.currentSignType == T(org.esupportail.esupsignature.entity.enums.SignType).hiddenVisa} ? '' : ' es-refuse-slot-hidden'"
                            th:styleappend="'width:auto;flex:0 0 auto;'">
                            <span class="es-tools-or">ou</span>
                            <div class="es-tools-button-shell rounded-3 d-flex">
                                <button tabindex="1" th:id="'refuseLaunchButton'" class="btn p-3 btn-danger" title="Refuser" aria-label="Refuser"
                                        th:styleappend="'width:auto;max-width:none;flex:0 0 auto;'"
                                        th:token="${signRequestLight.token}" data-bs-toggle="modal" data-bs-target="#refuseModal">
                                    <i class="fi fi-rr-document-circle-wrong "></i><span class="es-tools-refuse-label"> Refuser</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="showSignRequest" type="org.esupportail.esupsignature.dto.page.user.signrequest.ShowSignRequestDto"*/-->
<!--/*@thymesVar id="signRequestFull" type="org.esupportail.esupsignature.dto.page.user.signrequest.SignRequestFullDto"*/-->
<!--/*@thymesVar id="signRequestLight" type="org.esupportail.esupsignature.dto.page.user.signrequest.ShowSignRequestDto.SignRequestLightDto"*/-->
<!--/*@thymesVar id="globalProperties" type="org.esupportail.esupsignature.config.GlobalProperties"*/-->

<div th:fragment="breadcrumb-content(tabsId)" class="d-flex align-items-center w-100 border-0" style="min-width: 0;">
    <button type="button"
            class="js-display-side-btn btn btn-sm btn-light d-xxl-none ms-2 flex-shrink-0"
            th:id="${tabsId + '-display-side-btn'}"
            data-bs-toggle="offcanvas"
            data-bs-target="#sidebar"
            aria-controls="sidebar"
            title="Afficher l'état du circuit"
            aria-label="Afficher l'état du circuit">
        <i class="fi fi-rr-sidebar"></i>
    </button>
    <div id="workflowName" class="es-breadcrumb-title ps-2 d-none d-xl-flex border-end" style="flex: 0 0 300px;">
        <i class="fi fi-rr-folder"></i> <p th:title="${showSignRequest.signBookLight.workflowName}" class="text-uppercase m-0" th:text="${showSignRequest.signBookLight.workflowName}" style="width: 264px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></p>
    </div>

    <div style="flex: 1 1 auto; min-width: 0;" th:replace="~{user/signrequests/includes/ws-tabs :: ws-tabs(${tabsId})}"></div>
    <div class="btn-group me-2 ms-auto d-none d-md-block" role="group" aria-label="Ouverture automatique de la demande suivante" th:if="${showSignRequest.nextSignRequestId != null}">
    </div>
</div>

<nav th:fragment="breadcrumb" id="breadcrumb" aria-label="breadcrumb" class="es-breadcrumb-nav es-breadcrumb-nav-full-fixed es-breadcrumb-nav-full es-breadcrumb-sign">
    <th:block th:replace="~{user/signrequests/includes/show-sections :: breadcrumb-content('ws-tabs')}"></th:block>
</nav>

<div th:fragment="sign-buttons" id="signButtons" class="es-sign-buttons d-flex flex-column justify-content-between bg-white es-fixed-action-btns active">
    <div class="d-flex flex-column gap-2">
        <th:block th:replace="~{fragments/sign-buttons :: toggle}"></th:block>
        <button id="infos-btn" tabindex="0" class="d-flex justify-content-center btn btn-transparent text-dark d-none d-lg-flex"
                th:title="#{signButtons.information}" th:aria-label="#{signButtons.information}" data-bs-toggle="modal" data-bs-target="#detailsModal">
            <i class="fi fi-rr-info"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.information}"></span>
        </button>
        <button th:if="${signRequestFull.updateAllowed && (signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).pending || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).draft)}" type="button" class="d-flex justify-content-center btn btn-transparent text-dark d-none d-md-flex"
                th:title="#{signButtons.settings}" th:aria-label="#{signButtons.settings}" data-bs-toggle="modal" data-bs-target="#updateSignbookModal">
            <i class="fi fi-rr-settings-sliders"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.settings}"></span>
        </button>
        <form th:if="${showSignRequest.displayNotif}"
              th:action="'/user/signrequests/replay-notif/' + ${signRequestLight.id}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button th:title="#{signButtons.notify}" th:aria-label="#{signButtons.notify}" type="submit" class="d-flex justify-content-center btn btn-transparent text-dark">
                <i class="fi fi-rr-bullhorn"></i>
                <span class="es-sign-button-label" th:text="#{signButtons.notify}"></span>
            </button>
        </form>
        <button id="attachment-trigger-button" class="d-flex flex-column align-items-center btn btn-transparent text-dark" data-bs-toggle="modal"
                th:title="#{signButtons.attachments}" th:aria-label="#{signButtons.attachments}"
                data-bs-target="#attachment"
                th:if="${user.userType.name() != 'external' || showSignRequest.workflow.externalCanReaderAttachments}">
            <span id="attachment-badge"
                  th:text="${showSignRequest.attachments.size() + signRequestLight.links.size()}"
                  class="badge rounded-pill bg-primary"
                  th:classappend="${showSignRequest.attachments != null && showSignRequest.attachments.size() + signRequestLight.links.size() > 0} ? '' : ' d-none'"
                  style="margin-bottom: -10px; z-index: 1;"></span>
            <i class="fi fi-rr-clip"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.attachments}"></span>
        </button>
        <button class="d-flex justify-content-center btn btn-transparent text-dark" data-bs-toggle="modal"
                th:title="#{signButtons.postit}" th:aria-label="#{signButtons.postit}"
                data-bs-target="#addCommentModal"
                th:if="${(showSignRequest.workflow.externalCanEdit || user.userType.name() != 'external') && signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).pending || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).draft}"
        >
            <i class="fi fi-rr-notes"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.postit}"></span>
        </button>
        <button th:if="${user.userType.name() == 'external'}" id="signImageBtn" class="d-flex justify-content-center btn btn-transparent text-dark d-none d-lg-flex"
                th:title="#{signButtons.signatures}" th:aria-label="#{signButtons.signatures}">
            <i class="fi fi-rr-drawer-alt"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.signatures}"></span>
        </button>
        <button th:if="${user.userType.name() != 'external' && showSignRequest.externalsRecipients != null && showSignRequest.externalsRecipients.size() > 0}" class="d-flex justify-content-center btn btn-transparent text-dark"
                th:title="#{signButtons.shareLink}" th:aria-label="#{signButtons.shareLink}" data-bs-toggle="modal" data-bs-target="#sendLinkModal">
            <i class="fi fi-rr-share"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.shareLink}"></span>
        </button>
        <a target="_blank" th:if="${signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).completed || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).exported}" class="d-flex justify-content-center btn btn-transparent text-dark" th:href="'/user/validation/document/' + ${signRequestLight.id}"
           th:title="#{signButtons.validate}" th:aria-label="#{signButtons.validate}">
            <i class="fi fi-rr-audit"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.validate}"></span>
        </a>
        <button th:if="${signRequestFull.signable && globalProperties.enableTransfertForUsers}" tabindex="1" id="forward-btn" class="d-flex justify-content-center btn btn-transparent text-dark d-none"
                th:title="#{signButtons.forward}" th:aria-label="#{signButtons.forward}" data-bs-toggle="modal" data-bs-target="#forwardModal">
            <i class="fi fi-rr-refer-arrow"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.forward}"></span>
        </button>
        <button th:if="${user.userType.name() != 'external'
                    && userEppn == authUserEppn
                    && !globalProperties.hideSendSignRequest
                    && showSignRequest.signedDocuments != null
                    && showSignRequest.signedDocuments.size() > 0
                    && (signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).completed
                        || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).exported
                        || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).archived
                        || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).cleaned)}"
                type="button"
                class="js-reuse-last-signed-file d-flex justify-content-center btn btn-transparent text-dark"
                data-bs-toggle="modal"
                data-bs-target="#wiz-fast-sign-modal"
                th:title="#{signButtons.reuse}" th:aria-label="#{signButtons.reuse}"
                th:attr="data-document-id=${showSignRequest.signedDocuments[showSignRequest.signedDocuments.size() - 1].id},
                         data-filename=${showSignRequest.signedDocuments[showSignRequest.signedDocuments.size() - 1].fileName}">
            <span class="spinner-border spinner-border-sm d-none js-reuse-last-signed-spinner" aria-hidden="true"></span>
            <i class="fi fi-rr-paper-plane js-reuse-last-signed-icon"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.reuse}"></span>
        </button>
        <a th:if="${showSignRequest.workflow.authorizeClone && signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).refused && signRequestLight.createBy.eppn == userEppn}" tabindex="1" type="button"
           class="d-flex justify-content-center btn btn-transparent text-dark" data-bs-toggle="modal"
           th:title="#{signButtons.retry}" th:aria-label="#{signButtons.retry}"
           data-bs-target="#cloneModal">
            <i class="fi fi-rr-refresh" style="margin-top: 10px;"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.retry}"></span>
        </a>
        <th:block id="openButtons" class="es-fixed-action-btns active"
                  th:if="${showSignRequest.viewRight && (signRequestLight.deleted || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).completed || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).exported || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).archived || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).cleaned)}">
            <li>
                <a tabindex="1" th:if="${signRequestLight.status != T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).exported}"
                   class="btn btn btn-floating bg-dark d-none" th:href="'/user/validation/document/' + ${signRequestLight.id}"
                   th:title="#{signButtons.validate}" th:aria-label="#{signButtons.validate}">
                    <i class="fi fi-rr-registration-paper"></i>
                    <span class="es-sign-button-label" th:text="#{signButtons.validate}"></span>
                </a>
            </li>
        </th:block>
    </div>
    <div class="d-flex flex-column gap-2">
        <a th:if="${signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).refused && signRequestLight.createBy.eppn == userEppn}" tabindex="1" class="d-flex justify-content-center btn btn-transparent text-dark me-1 d-none d-sm-flex"
           th:href="'/ws-secure/global/get-original-file/' + ${signRequestLight.id}" target="_blank"
           th:title="#{signButtons.downloadOriginal}" th:aria-label="#{signButtons.downloadOriginal}">
            <i class="fi fi-rr-progress-download" style="margin-top: 10px;"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.downloadOriginal}"></span>
        </a>
        <div th:if="${!showSignRequest.workflow.forbidDownloadsBeforeEnd && signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).pending}">
            <a tabindex="1" class="d-flex justify-content-center btn btn-transparent text-dark me-1 d-none d-sm-flex"
               th:href="'/ws-secure/global/get-last-file/' + ${signRequestLight.id}" target="_blank"
               th:title="#{signButtons.download}" th:aria-label="#{signButtons.download}">
                <i class="fi fi-rr-download " style="margin-top: 0;"></i>
                <span class="es-sign-button-label" th:text="#{signButtons.download}"></span>
            </a>
        </div>
        <div th:if="${signRequestLight.status != T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).pending && signRequestLight.status != T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).refused}">
            <a tabindex="1" class="d-flex justify-content-center btn btn-transparent text-dark me-1 d-none d-sm-flex"
               th:href="'/ws-secure/global/get-last-file/' + ${signRequestLight.id}" target="_blank"
               th:title="#{signButtons.downloadLatest}" th:aria-label="#{signButtons.downloadLatest}">
                <i class="fi fi-rr-download " style="margin-top: 0"></i>
                <span class="es-sign-button-label" th:text="#{signButtons.downloadLatest}"></span>
            </a>
        </div>
        <div th:if="${signRequestFull.nbSignRequests > 1 && (showSignRequest.signBookLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).completed || showSignRequest.signBookLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).exported || showSignRequest.signBookLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).archived || showSignRequest.signBookLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).cleaned)}">
            <a tabindex="1" class="d-flex justify-content-center btn btn-transparent text-dark me-1 d-none d-sm-flex"
               th:href="'/ws-secure/global/get-last-files/' + ${showSignRequest.signBookLight.id}" target="_blank"
               th:title="#{signButtons.downloadZip}" th:aria-label="#{signButtons.downloadZip}">
                <i class="fi fi-rr-box " style="margin-top: 0"></i>
                <span class="es-sign-button-label" th:text="#{signButtons.downloadZip}"></span>
            </a>
        </div>
        <div th:if="${showSignRequest.lastSignedDocumentContentType == 'application/pdf' && (signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).completed || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).exported || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).archived || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).cleaned)}">
            <a tabindex="1" class="d-flex justify-content-center btn btn-transparent text-dark me-1 d-none d-sm-flex"
               th:href="'/ws-secure/global/get-last-file-report/' + ${signRequestLight.id}" target="_blank"
               th:title="#{signButtons.downloadReport}" th:aria-label="#{signButtons.downloadReport}">
                <i class="fi fi-rr-compliance-document " style="margin-top: 0;"></i>
                <span class="es-sign-button-label" th:text="#{signButtons.downloadReport}"></span>
            </a>
        </div>
        <div  th:if="${showSignRequest.lastSignedDocumentContentType == 'application/pdf' && (signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).completed || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).exported || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).archived || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).cleaned)}">
            <a tabindex="1" class="d-flex justify-content-center btn btn-transparent text-dark me-1 d-none d-sm-flex" th:href="'/ws-secure/global/get-seda/' + ${signRequestLight.id}"
               th:title="#{signButtons.exportSeda}" th:aria-label="#{signButtons.exportSeda}">
                <i class="fi fi-rr-folder-download"></i>
                <span class="es-sign-button-label" th:text="#{signButtons.exportSeda}"></span>
            </a>
        </div>
        <div th:if="${showSignRequest.lastSignedDocumentContentType == 'application/pdf' && (signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).completed || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).exported || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).archived || signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).cleaned)}">
            <a tabindex="1" class="d-flex justify-content-center btn btn-transparent text-dark me-1 d-none d-sm-flex js-print-download-warning"
               th:href="'/ws-secure/global/print-with-code/' + ${signRequestLight.id}" target="_blank"
               th:title="#{signButtons.printDatamatrix}" th:aria-label="#{signButtons.printDatamatrix}">
                <i class="fi fi-rr-print " style="margin-top: 0;"></i>
                <span class="es-sign-button-label" th:text="#{signButtons.printDatamatrix}"></span>
            </a>
        </div>
        <button tabindex="0" th:if="${!showSignRequest.workflow.forbidDownloadsBeforeEnd && signRequestLight.status == T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).pending}"
           class="d-flex justify-content-center btn btn-transparent text-dark  d-none d-lg-flex"
           id="print-last-file-button"
           th:attr="data-print-url='/ws-secure/global/get-last-file-inline/' + ${signRequestLight.id}"
           target="_blank"
           th:title="#{signButtons.print}" th:aria-label="#{signButtons.print}">
            <i class="fi fi-rr-print"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.print}"></span>
        </button>
        <a th:if="${(signRequestLight.createBy.eppn == userEppn || signRequestFull.manager) && signRequestLight.deleted}" tabindex="1" th:href="'/user/signbooks/restore/' + ${showSignRequest.signBookLight.id}" role="button" class="d-flex justify-content-center btn btn-transparent text-primary me-1 d-none d-sm-flex"
           th:title="#{signButtons.restore}" th:aria-label="#{signButtons.restore}">
            <i class="fi fi-rr-trash-restore-alt " style="margin-top: 10px;"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.restore}"></span>
        </a>
        <div class="d-sm-flex d-none w-100" th:if="${@preAuthorizeService.signRequestDelete(signRequestLight.id, authUserEppn) && (!signRequestLight.status.equals(T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).completed) || showSignRequest.signBookLight.status.equals(T(org.esupportail.esupsignature.entity.enums.SignRequestStatus).completed))}">
            <button tabindex="1" id="trashLaunchButton" class="w-100 d-flex justify-content-center btn btn-transparent text-danger d-none d-sm-flex"
                    th:title="${!signRequestLight.deleted ? #messages.msg('signButtons.trash') : #messages.msg('signButtons.deletePermanently')}"
                    th:aria-label="${!signRequestLight.deleted ? #messages.msg('signButtons.trash') : #messages.msg('signButtons.deletePermanently')}"
                    data-bs-toggle="modal" th:data-bs-target="'#modal-warning-' + ${signRequestLight.id}">
                <i th:if="${signRequestLight.deleted}" class="fi fi-rr-trash-xmark " style="margin-top: 0;"></i>
                <i th:if="${!signRequestLight.deleted}" class="fi fi-rr-trash " style="margin-top: 0;"></i>
                <span class="es-sign-button-label"
                      th:text="${!signRequestLight.deleted ? #messages.msg('signButtons.trash') : #messages.msg('signButtons.deletePermanently')}"></span>
            </button>
        </div>
        <button type="button"
                class="w-100 d-flex justify-content-center btn btn-transparent text-success d-none d-sm-flex js-sign-goto-next-switch"
                aria-pressed="false"
                title="Activer l'ouverture automatique de la demande suivante">
            <i class="fi fi-rr-infinite-cycle"></i>
            <span class="es-sign-button-label" th:text="#{signButtons.nextAuto}"></span>
        </button>
        <div th:if="${showSignRequest.nextSignRequestId != null}" class="d-md-block d-none">
            <a tabindex="1" id="nextSignBookButton" role="button"
               th:href="'/' + ${showSignRequest.urlProfil} + '/signrequests/' + ${showSignRequest.nextSignRequestId}"
               class="btn btn-transparent text-dark" th:title="#{signButtons.next}" th:aria-label="#{signButtons.next}">
                <i class="fi fi-rr-arrow-alt-to-right " style="margin-top: 10px;"></i>
                <span class="es-sign-button-label" th:text="#{signButtons.next}"></span>
            </a>
        </div>
    </div>
</div>

</html>
